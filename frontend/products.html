<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Karankar Sons</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/feedback.css">
  <script src="/js/api.js"></script>
  <script src="/js/ui-components.js"></script>
  <style>
    .filters-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 1rem;
      max-width: 820px;
      margin: 1.5rem auto 0;
    }
    .qty-selector {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .qty-input {
      width: 60px;
      padding: 0.25rem;
      text-align: center;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    .total-price {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }
    .package-card {
      background: linear-gradient(to right, #263238, #37474f);
      color: white;
      padding: 2rem;
      border-radius: var(--border-radius);
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 20px var(--shadow-color);
    }
    .package-title {
      color: var(--accent-color);
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
    .search-control {
      position: relative;
    }
    .search-clear-btn {
      position: absolute;
      top: 50%;
      right: 0.65rem;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 50%;
      background: rgba(38, 50, 56, 0.08);
      color: var(--secondary-color);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .search-clear-btn.visible {
      display: inline-flex;
    }
    @media (max-width: 768px) {
      .filters-bar { grid-template-columns: 1fr; }
      .package-card { flex-direction: column; text-align: center; gap: 1rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="logo">
        <span class="logo-icon">💧</span> Karankar Sons
      </a>
      <button class="menu-toggle">☰</button>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/products" style="color: var(--primary-color);">Products</a></li>
        <li><a href="/#services">Services</a></li>
        <li><a href="/#estimate-section">Estimate</a></li>
        <li><a href="/#contact-us">Contact Us</a></li>
        <li class="nav-cart-item">
          <a href="/cart" class="nav-cart-btn" id="nav-cart-btn">
            <span class="cart-icon">🛒</span>
            <span class="cart-badge" id="cart-badge">0</span>
          </a>
        </li>
        <li><a href="/login" class="btn btn-primary" style="padding: 0.5rem 1rem; color: #fff;">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- Products Content -->
  <section class="section-padding bg-light">
    <div class="container">
      <div style="text-align: center; margin-bottom: 3rem;">
        <h1 style="margin-bottom: 1rem;">Solutions & Products</h1>
        <p style="color: #666; max-width: 600px; margin: 0 auto;">Professional grade complete packages and individual materials for long-lasting structural strength.</p>
        <div class="filters-bar">
          <div class="search-control">
            <input id="product-search" class="form-control" placeholder="Search products by name or description" />
            <button type="button" id="product-search-clear" class="search-clear-btn" aria-label="Clear search">×</button>
          </div>
          <select id="product-filter" class="form-control">
            <option value="">All Products</option>
            <option value="Repair Work">Repair Work</option>
            <option value="New Construction">New Construction</option>
          </select>
        </div>
      </div>

      <!-- Products Layout -->
      <div style="margin-top: 4rem;">
        <div class="grid-3" id="products-grid">
          <p style="grid-column: span 3; text-align: center;">Loading products...</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer style="margin-top: auto;">
    <div class="container">
      <div class="footer-bottom" style="margin-top: 0;">
        &copy; 2026 Karankar Sons & Chemicals.
      </div>
    </div>
  </footer>

  <script src="/js/cart.js"></script>
  <script src="/js/pagination.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/script.js"></script>
</body>
</html>
