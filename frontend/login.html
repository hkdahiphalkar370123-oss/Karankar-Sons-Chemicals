<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Karankar Sons</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/feedback.css">
  <script src="/js/api.js"></script>
  <script src="/js/ui-components.js"></script>
  <script src="/js/pagination.js"></script>
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      padding: 1.5rem;
    }
    .login-box {
      background: #fff;
      padding: 3rem;
      border-radius: var(--border-radius);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 800;
      color: var(--secondary-color);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-box">
      <div class="login-logo">
        <span style="color: var(--primary-color)">💧</span> KS
      </div>
      <h2 style="text-align: center; margin-bottom: 1.5rem;">Sign In</h2>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" title="Please enter a valid email address.">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required minlength="8" title="Password must be at least 8 characters.">
        </div>
        <div id="errorMsg" style="color: red; margin-bottom: 1rem; text-align: center; display: none;"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">Sign In</button>
        <div style="text-align: center; margin-top: 1.5rem;">
          <p style="margin-bottom: 1rem;">New customer? <a href="javascript:void(0)" onclick="toggleRegister()">Create Account</a></p>
          <a href="/" style="font-size: 0.9rem;">&larr; Back to Home</a>
        </div>
      </form>

      <!-- Registration Form (Hidden by default) -->
      <form id="registerForm" style="display: none;">
        <h3 style="text-align: center; margin-bottom: 1rem;">Create Customer Account</h3>
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="regName" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="text" id="regPhone" class="form-control" required>
        </div>
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" id="regAddress" class="form-control" required>
        </div>
        <div class="grid-2" style="margin-bottom: 0;">
          <div class="form-group">
            <label class="form-label">City</label>
            <input type="text" id="regCity" class="form-control" required>
          </div>
          <div class="form-group">
            <label class="form-label">Pincode</label>
            <input type="text" id="regPincode" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" class="form-control" required>
        </div>
        <div id="regErrorMsg" style="color: red; margin-bottom: 1rem; text-align: center; display: none;"></div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem;">Create Account</button>
        <div style="text-align: center; margin-top: 1.5rem;">
          <a href="javascript:void(0)" onclick="toggleRegister()">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function toggleRegister() {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      if (loginForm.style.display === 'none') {
        loginForm.style.display = 'block';
        registerForm.style.display = 'none';
        document.querySelector('h2').innerText = 'Sign In';
      } else {
        loginForm.style.display = 'none';
        registerForm.style.display = 'block';
        document.querySelector('h2').innerText = 'Register';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      try {
        if(password.length < 8) {
           throw new Error("Password must be at least 8 characters long.");
        }
        const res = await window.API.login(email, password);
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data));

        window.location.href = res.data.role === 'admin' ? '/admin/dashboard' : '/';
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const phone = document.getElementById('regPhone').value;
      const address = document.getElementById('regAddress').value;
      const city = document.getElementById('regCity').value;
      const pincode = document.getElementById('regPincode').value;
      const password = document.getElementById('regPassword').value;
      const errorMsg = document.getElementById('regErrorMsg');
      errorMsg.style.display = 'none';

      try {
        const res = await window.API.register({ name, email, password, phone, address, city, pincode });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data));
        window.location.href = '/';
      } catch (err) {
        errorMsg.innerText = err.message;
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
